name: hyundai_care_plus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/hyundai_care_plus_logo.png
    

flutter_launcher_icons:
  android: true
  ios: true

  web:
    generate: true
    image_path: assets/images/hyundai_care_plus_logo.png
    background_color: "#002C5F"
    theme_color: "#002C5F"

  image_path: assets/images/hyundai_care_plus_logo.png

  min_sdk_android: 21